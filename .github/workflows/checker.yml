name: Yurt İlan Kontrolcüsü

on:
  schedule:
    # Pazartesi - Perşembe günleri otomatik çalışır
    - cron: '*/7 * * * 1,2,3,4'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    # Görülen ilanların hatırlanması için hafıza/cache adımı
    - name: İlan Önbelleğini Yükle
      uses: actions/cache@v4
      with:
        path: seen_offers.txt
        key: offer-cache-${{ github.run_id }}
        restore-keys: |
          offer-cache-

    - name: Botu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
